name: Pesquisa e editor
on:
  push:
    branches: ['ajustes/pesquisa-editor']
permissions:
  contents: read
jobs:
  aceite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: node scripts/bench-pesquisa.js
        if: always()
      - run: node scripts/aceite-pesquisa.js
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Testar aplicativo empacotado
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath 'dist/win-unpacked' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Aplicação não encontrada.' }
          $env:BIZUTECA_E2E_EXECUTABLE = $exe.FullName
          $env:BIZUTECA_VERIFY_LEGACY = '1'
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-editor
          path: test-results
