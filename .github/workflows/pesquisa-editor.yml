name: Pesquisa e editor
on:
  push:
    branches: ['ajustes/pesquisa-editor']
permissions:
  contents: read
jobs:
  aceite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: node scripts/bench-pesquisa.js
