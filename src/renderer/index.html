<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: tv-attachment:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>BIZUTECA 9MM — Seu caderno de estudos</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><button id="toggle-library" class="icon-button" aria-label="Mostrar ou recolher biblioteca" title="Mostrar ou recolher biblioteca"><span class="ico menu"></span></button><button id="home" class="brand" title="Início"><img class="brand-logo" src="../assets/bizuteca.png" alt="Logo Bizuteca" width="48" height="48"><span class="brand-copy"><span class="brand-name">BIZUTECA <b>9MM</b></span><small>Anote. Organize. Revise. Domine.</small></span></button><nav class="history-controls" aria-label="Histórico"><button id="nav-back" type="button" title="Voltar (Alt + ←)" aria-label="Voltar" disabled>←</button><button id="nav-next" type="button" title="Avançar (Alt + →)" aria-label="Avançar" disabled>→</button><button id="nav-library" type="button" title="Biblioteca" aria-label="Biblioteca"><span class="ico folder"></span></button></nav><label class="global-search"><span class="ico search"></span><input id="global-search" placeholder="Pesquisar no caderno" aria-label="Pesquisar no caderno"><kbd>Ctrl K</kbd></label><select id="search-scope" aria-label="Escopo da pesquisa"><option value="all">Toda a biblioteca</option><option value="subject">Matéria atual</option><option value="folder">Pasta atual</option></select><button id="new-note" class="primary"><span class="ico plus"></span> Nova anotação</button><button id="toggle-consult" class="outline"><span class="ico consult"></span><span>Encontrar no meu caderno</span></button></header>
<div class="workspace" id="workspace">
<aside class="library" aria-label="Biblioteca de matérias"><div class="side-title"><h2>BIBLIOTECA</h2><button id="new-folder" class="outline small"><span class="ico plus"></span> Pasta</button></div><label class="tree-search"><span class="ico search"></span><input id="tree-search" placeholder="Localizar pasta ou anotação" aria-label="Localizar na biblioteca"></label><div class="tree-tools"><button id="collapse-all" class="text-button">Recolher pastas</button><span id="folder-total"></span></div><div id="tree" class="tree" role="tree" aria-label="Pastas e anotações"></div><nav class="side-nav"><button data-view="favorites"><span class="ico star"></span> Favoritos</button><button data-view="recent"><span class="ico clock"></span> Recentes</button><button data-view="calendar"><span class="ico calendar" aria-hidden="true"></span> Calendário</button><button data-view="trash"><span class="ico trash"></span> Lixeira</button><button data-view="themes"><span class="ico palette"></span> Aparência e temas</button><button data-view="settings"><span class="ico settings"></span> Dados e configurações</button></nav><div id="resize-library" class="resize-handle" title="Arraste para ajustar a largura"></div></aside>
<main id="main" class="main" tabindex="-1"></main>
<aside id="consult-panel" class="consult-panel" aria-label="Encontrar no meu caderno"><div class="panel-heading"><h2>Encontrar no meu caderno</h2><button id="close-consult" class="icon-button" aria-label="Recolher consulta"><span class="ico close"></span></button></div><p class="muted">Localize material no seu caderno</p><label class="sr-only" for="question">Enunciado ou tema</label><textarea id="question" placeholder="Cole o enunciado ou escreva um assunto…" rows="6"></textarea><label class="sr-only" for="consult-folder">Onde pesquisar</label><select id="consult-folder"><option value="">Toda a biblioteca</option></select><button id="consult" class="primary wide"><span class="ico search"></span> Encontrar material</button><div class="result-heading"><h3>Material relacionado</h3><button id="clear-consult" class="text-button">Limpar</button></div><div id="consult-results"><div class="empty compact"><span class="ico consult"></span><p>Seus resumos aparecem aqui quando você faz uma consulta.</p><small>A pesquisa funciona offline, por palavras e sinônimos.</small></div></div></aside>
</div>
<footer class="statusbar"><button id="data-status" class="status-location" title="Ver local de salvamento"><span class="save-dot"></span><span id="save-status" role="status">Abrindo biblioteca…</span></button><span class="footer-divider"></span><span class="offline"><span class="ico offline"></span> Offline</span><span id="word-count"></span><span class="footer-spacer"></span><button id="backup" class="outline small"><span class="ico database"></span> Backup</button></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Fechar janela"><span class="ico close"></span></button></div><div id="dialog-body"></div><div id="dialog-actions" class="dialog-actions"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="themes.js"></script><script src="../core/dates.js"></script><script src="upgrade.js"></script><script src="editor-tools.js"></script><script src="app.js"></script></body></html>
